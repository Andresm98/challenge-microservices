server:
    port: 8082

spring:
    application:
        name: account-service
    r2dbc:
        url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/account_db}
        username: ${SPRING_R2DBC_USERNAME:user}
        password: ${SPRING_R2DBC_PASSWORD:password}
    sql:
        init:
            mode: always
    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        producer:
            key-serializer: org.apache.kafka.common.serialization.StringSerializer
            value-serializer: org.apache.kafka.common.serialization.StringSerializer
        consumer:
            group-id: notification-group
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Configuración para el WebClient (Reporte F4)
customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081/api/v1/customers}
    timeout: ${CUSTOMER_SERVICE_TIMEOUT:2s}

account:
    security:
        username: ${ACCOUNT_API_USER:account-api}
        password: ${ACCOUNT_API_PASSWORD:}

springdoc:
    swagger-ui:
        url: /docs/openapi.yaml
    api-docs:
        path: /v3/api-docs

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            probes:
                enabled: true
    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                "[http.server.requests]": true

logging:
    structured:
        format:
            console: logstash
