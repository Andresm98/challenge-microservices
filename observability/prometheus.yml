global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: account-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    basic_auth:
      username: account-api
      password_file: /etc/prometheus/secrets/account-api-password
    static_configs:
      - targets: [account-service:8082]

  - job_name: customer-service
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: [customer-service:8081]